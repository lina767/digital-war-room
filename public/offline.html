<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline — Digital War Room</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        font-family: system-ui, sans-serif;
        background: #0a0a0a;
        color: #e5e5e5;
      }
      .card {
        max-width: 22rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 0.5rem;
        padding: 1.5rem;
        background: rgba(255, 255, 255, 0.03);
      }
      h1 {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #a3e635;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #a3a3a3;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.65rem 1.25rem;
        min-height: 44px;
        line-height: 1.2;
        font-size: 0.875rem;
        font-weight: 500;
        color: #0a0a0a;
        background: #a3e635;
        border-radius: 0.375rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Digital War Room</h1>
      <p>You’re offline. Open the app again when you have a connection, or retry from the home screen if the page was cached.</p>
      <a href="/">Back to dashboard</a>
    </div>
  </body>
</html>
