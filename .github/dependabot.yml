version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "vite*"
          - "vitest*"
          - "typescript*"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-dev-dependencies:
        patterns:
          - "pytest*"
          - "mypy*"
          - "ruff*"
