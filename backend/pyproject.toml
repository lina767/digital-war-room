[project]
name = "digital-war-room-backend"
version = "0.1.0"
description = "Backend for Digital War Room – FastAPI + agents"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]
exclude = [".git", "__pycache__", "data", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402", "I001"]  # load_dotenv before app imports; lazy imports in loop
"tests/*" = ["S101"]  # allow assert in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
